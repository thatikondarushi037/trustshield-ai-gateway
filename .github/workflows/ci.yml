name: TrustShield regression and container checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.13"}
          - {os: windows-latest, python: "3.14"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python src/split_v02_synthetic.py
      - run: python src/build_v02_hard_examples.py
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: python -m src.demo
      - run: python -m src.release_checks
      - run: git diff --check
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: docker build --target ci --tag trustshield:ci .
      - run: docker build --tag trustshield:1.0.0-rc1 .
      - run: python scripts/verify_image.py
