name: trustshield
services:
  api:
    build: .
    image: trustshield:1.0.0-rc1
    ports:
      - "127.0.0.1:${TRUSTSHIELD_API_PORT:-8000}:8000"
    environment:
      TRUSTSHIELD_AUDIT_TOKEN_FILE: /run/secrets/audit_token
      TRUSTSHIELD_MONITORING_CIDRS: 172.29.77.0/24
      TRUSTSHIELD_OLLAMA_URL: http://host.docker.internal:11434/api/generate
      TRUSTSHIELD_ARCHIVE_REPORTS: "true"
    secrets: [audit_token]
    volumes: [audit_data:/app/runtime]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [operations]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs: [/tmp:size=64m]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  dashboard:
    image: trustshield:1.0.0-rc1
    command: [python, -m, streamlit, run, dashboard.py, --server.address, 0.0.0.0, --server.port, "8501", --server.headless, "true", --browser.gatherUsageStats, "false"]
    ports:
      - "127.0.0.1:${TRUSTSHIELD_DASHBOARD_PORT:-8501}:8501"
    environment:
      TRUSTSHIELD_API_URL: http://api:8000
      TRUSTSHIELD_AUDIT_TOKEN_FILE: /run/secrets/audit_token
    secrets: [audit_token]
    networks: [operations]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs: [/tmp:size=64m]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
secrets:
  audit_token:
    file: ./.secrets/audit_token
volumes:
  audit_data:
networks:
  operations:
    ipam:
      config:
        - subnet: 172.29.77.0/24
